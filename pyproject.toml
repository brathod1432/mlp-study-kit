[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "mlp-study-kit"
version     = "0.3.0"
description = "Build a Multi-Layer Perceptron from scratch in NumPy — progressive exercises, homework, and debug tools"
authors     = [{ name = "Brijesh Rathod", email = "bgrathod00@gmail.com" }]
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "neural-network", "mlp", "backpropagation",
    "numpy", "deep-learning", "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

# Runtime deps — minimal; TF/torch are optional extras
dependencies = [
    "numpy>=1.26,<3.0",      # <3.0 keeps TF 2.x compatible; numpy 2.x works for nn_core
    "matplotlib>=3.8,<4.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "colorama>=0.4.6,<1.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
tensorflow = [
    # TF 2.14 requires numpy <2.0; pin together to avoid solver conflicts.
    # Equivalent to requirements_windows.txt or requirements_linux.txt.
    "numpy>=1.26,<2.0",
    "tensorflow>=2.14,<2.16",
    "keras>=2.14,<3.0",
]
dev = [
    # Equivalent to requirements_dev.txt — dev tools work on both OS.
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.4,<1.0",
    "bandit[toml]>=1.7,<2.0",
    "mypy>=1.8,<2.0",
    "pre-commit>=3.6,<4.0",
    "pip-audit>=2.6,<3.0",
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.0,<7.0",
]

[project.urls]
"Homepage"    = "https://github.com/brathod1432/mlp-study-kit"
"Bug Tracker" = "https://github.com/brathod1432/mlp-study-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

# ── ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP007"]   # long lines & X | Y union syntax (keep 3.10 compat)

# ── bandit ─────────────────────────────────────────────────────────────────
[tool.bandit]
targets  = ["src"]
skips    = ["B101"]          # B101 = assert used in tests — acceptable

# ── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version   = "3.10"
mypy_path        = "src"
ignore_missing_imports = true
warn_return_any  = true

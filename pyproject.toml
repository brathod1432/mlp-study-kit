[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mlp-study-kit"
version = "0.1.0"
description = "Build a Multi-Layer Perceptron from scratch in NumPy -- progressive exercises, homework, and debug tools"
authors = [{ name = "Brijesh Rathod", email = "bgrathod00@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["neural-network", "mlp", "backpropagation", "numpy", "deep-learning", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "matplotlib>=3.8,<4.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "colorama>=0.4.6,<1.0",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow>=2.14,<3.0",
    "keras>=2.14,<3.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.4,<1.0",
]

[project.urls]
"Homepage"    = "https://github.com/brathod1432/mlp-study-kit"
"Bug Tracker" = "https://github.com/brathod1432/mlp-study-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
